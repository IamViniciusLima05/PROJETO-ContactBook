<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContactBook | Agenda de contatos</title>
  <meta name="description" content="Agenda de contatos com foto, busca rápida, grupos e exportação em JSON.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="lateral">
      <header class="lateral__topo">
        <h1>Contatos</h1>
        <div class="menu">
          <button class="icone" id="exportar" title="Exportar JSON" aria-label="Exportar contatos em JSON">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
          </button>
          <label class="icone" title="Importar JSON">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>
            <input type="file" id="importar" accept="application/json,.json" class="sr" aria-label="Importar contatos de um arquivo JSON">
          </label>
          <button class="btn-novo" id="novo" aria-label="Novo contato" title="Novo contato">+</button>
        </div>
      </header>
      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <label class="sr" for="busca">Buscar contatos</label>
        <input id="busca" type="search" placeholder="Buscar nome, telefone ou e-mail  ( / )">
      </div>
      <div class="grupos" id="grupos" role="group" aria-label="Filtrar por grupo"></div>
      <div class="lista-area">
        <ul class="lista" id="lista"></ul>
        <nav class="indice" id="indice" aria-label="Pular para a letra"></nav>
      </div>
      <p class="total" id="total"></p>
    </aside>

    <main class="detalhe" id="detalhe" aria-live="polite"></main>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-titulo">
    <form method="dialog" id="form" novalidate>
      <h2 id="dlg-titulo">Novo contato</h2>
      <div class="foto-campo">
        <div class="avatar grande" id="f-avatar"></div>
        <div>
          <label class="btn sec pequeno">Escolher foto<input type="file" id="f-foto" accept="image/*" class="sr"></label>
          <button type="button" class="link" id="f-tirar-foto" hidden>Remover foto</button>
          <p class="nota">A foto é reduzida e salva no navegador.</p>
        </div>
      </div>
      <label>Nome *<input id="f-nome" maxlength="60" autocomplete="off"></label>
      <div class="linha">
        <label>Telefone<input id="f-tel" inputmode="tel" maxlength="16" placeholder="(51) 99999-9999"></label>
        <label>E-mail<input id="f-email" type="email" maxlength="80" placeholder="nome@email.com"></label>
      </div>
      <div class="linha">
        <label>Empresa<input id="f-empresa" maxlength="50"></label>
        <label>Grupo<select id="f-grupo"></select></label>
      </div>
      <label>Aniversário<input id="f-niver" type="date"></label>
      <label>Observações<textarea id="f-notas" rows="2" maxlength="300"></textarea></label>
      <p class="erro" id="f-erro" role="alert"></p>
      <div class="acoes">
        <button value="cancelar" formnovalidate class="btn sec">Cancelar</button>
        <button value="salvar" class="btn" id="f-salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="js/script.js"></script>
</body>
</html>
